<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma, Arial, sans-serif;
}

body{
background:#050505;
color:white;
text-align:center;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
width:700px;
height:700px;
background:radial-gradient(circle,#ff000040,transparent 70%);
top:-250px;
left:50%;
transform:translateX(-50%);
z-index:-1;
}

.header{
padding:50px 20px 20px;
}

.logo{
width:220px;
max-width:80%;
filter:drop-shadow(0 0 25px #ff0000);
}

.title{
font-size:48px;

margin-top:15px;
letter-spacing:2px;
}

.subtitle{
color:#b5b5b5;
margin-top:10px;
font-size:18px;
}

.section{
max-width:700px;
margin:40px auto;
padding:0 20px;
}

.section h2{
margin-bottom:20px;
font-size:28px;
color:#ff4444;
}

.card{
background:#111;
border:1px solid #222;
border-radius:20px;
padding:25px;
margin-bottom:20px;
box-shadow:0 0 25px rgba(255,0,0,.12);
}

.song-title{
font-size:24px;
margin-bottom:10px;
}

.song-desc{
color:#aaa;
}

.btn{
display:block;
text-decoration:none;
background:#161616;
color:white;
padding:18px;
margin:12px 0;
border-radius:15px;
font-size:18px;
transition:.3s;
border:1px solid #2a2a2a;
}

.btn:hover{
transform:translateY(-3px);
background:#202020;
box-shadow:0 0 20px rgba(255,0,0,.35);
}

.footer{
padding:40px 20px;
color:#777;
font-size:14px;
}

</style>
</head>

<body>

<div class="header">

</div>
